services:
  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: rxsmart-api
    runtime: python
    region: singapore          # closest free region to Chennai
    plan: free
    rootDir: backend
    buildCommand: >
      apt-get update &&
      apt-get install -y tesseract-ocr tesseract-ocr-eng poppler-utils &&
      pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rxsmart-db
          property: connectionString   # Render auto-injects the full postgresql:// URL
    healthCheckPath: /api/health

  # ── Frontend Static Site ───────────────────────────────────────────────────
  - type: web
    name: rxsmart
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    staticPublishPath: .
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /api/*
        destination: https://rxsmart-api.onrender.com/api/:splat

# ── PostgreSQL Database ────────────────────────────────────────────────────
databases:
  - name: rxsmart-db
    databaseName: rxsmart
    user: rxsmart
    region: singapore
    plan: free
